<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: #0A1628; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: sans-serif; }
  .map-wrapper { width: 95vw; max-width: 1100px; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,0.6); }
  svg { width: 100%; height: auto; display: block; }
  .route-path-animated {
    stroke: #0284C7;
    stroke-width: 10;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 16 12;
    animation: dash 1.4s linear infinite;
    filter: drop-shadow(0 0 6px rgba(2, 132, 199, 0.8));
  }
  @keyframes dash {
    from { stroke-dashoffset: 28; }
    to { stroke-dashoffset: 0; }
  }
</style>
</head>
<body>
  <div class="map-wrapper">
    <svg viewBox="0 0 1754 1241" xmlns="http://www.w3.org/2000/svg">
      <!-- High-res authentic blueprint -->
      <image href="floor0.png" width="1754" height="1241"/>
      
      <!-- Sample Route from Entrance 1 to Seminar Hall 124 -->
      <!-- Entrance 1 (x=550, y=576) -> East into West Corridor (x=734, y=576) -> North to (x=734, y=611) -> East into Seminar Hall (x=1043, y=611) -->
      <polyline points="550,576 734,576 734,611 1043,611" fill="none" class="route-path-animated"/>
      
      <!-- Start Marker -->
      <g transform="translate(550, 576)">
        <circle r="18" fill="none" stroke="#16A34A" stroke-width="4"/>
        <circle r="10" fill="#16A34A"/>
        <rect x="-65" y="-48" width="130" height="32" rx="6" fill="rgba(15, 23, 42, 0.9)" stroke="#16A34A" stroke-width="2"/>
        <text x="0" y="-27" fill="#4ADE80" font-size="14" font-weight="900" text-anchor="middle">START HERE</text>
      </g>
      
      <!-- Destination Marker -->
      <g transform="translate(1043, 611)">
        <circle r="22" fill="none" stroke="#DC2626" stroke-width="4"/>
        <circle r="12" fill="#DC2626"/>
        <rect x="-70" y="-52" width="140" height="34" rx="6" fill="rgba(15, 23, 42, 0.9)" stroke="#DC2626" stroke-width="2"/>
        <text x="0" y="-30" fill="#F87171" font-size="14" font-weight="900" text-anchor="middle">DESTINATION</text>
      </g>
    </svg>
  </div>
</body>
</html>
